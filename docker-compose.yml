# One file, one mode: `docker compose up` starts everything.
# Every variable has a working default; a .env file is optional (see .env.example).
name: tasky

# Shared by every service's healthcheck; each service adds only its own `test`.
x-healthcheck-timing: &healthcheck-timing
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 30s
  start_interval: 1s

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tasky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tasky}
      POSTGRES_DB: ${POSTGRES_DB:-tasky}
    volumes:
      - db-data:/var/lib/postgresql/data
    # No `ports`: the database is reachable only from the other services.
    healthcheck:
      <<: *healthcheck-timing
      # Over TCP, not the unix socket: the temporary server that postgres runs while it
      # initialises a new volume listens only on the socket and must not count as healthy.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tasky}:${POSTGRES_PASSWORD:-tasky}@db:5432/${POSTGRES_DB:-tasky}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-timing
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"
    develop:
      watch:
        - action: sync
          path: ./backend/app
          target: /app/app
        - action: sync
          path: ./backend/tests
          target: /app/tests
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/uv.lock

  frontend:
    build:
      context: ./frontend
    # The `/api` proxy target defaults to http://backend:8000 in frontend/vite.config.ts.
    ports:
      - "${FRONTEND_PORT:-8080}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-timing
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/index.html
          target: /app/index.html
        - action: sync+restart
          path: ./frontend/vite.config.ts
          target: /app/vite.config.ts
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json

volumes:
  db-data:
