[project]
name = "tasky-backend"
version = "0.1.0"
description = "Tasky task manager API"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Coverage runs on every `pytest`; pass `--no-cov` when running a subset of the tests.
addopts = ["--cov", "--cov-report=term-missing:skip-covered"]

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy's async layer runs on greenlets; without this coverage loses track of them.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder is not the alembic package.
known-third-party = ["alembic"]
