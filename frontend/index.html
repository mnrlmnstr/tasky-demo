<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Lets the browser paint its own dark canvas before the stylesheet arrives, so a dark OS never sees a white flash. -->
    <meta name="color-scheme" content="light dark" />
    <!-- Pins a saved light or dark theme before the first paint. Reads what src/stores/settings.ts saves; anything else leaves the OS scheme. -->
    <script>
      try {
        var theme = JSON.parse(localStorage.getItem('tasky:settings')).theme
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme)
      } catch (e) {}
    </script>
    <title>Tasky</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
